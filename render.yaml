services:
  - name: reverse-proxy
    type: web
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --legacy-peer-deps --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
